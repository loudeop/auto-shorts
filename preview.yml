name: preview-stills

# Quick check (about 10 minutes): writes the script + voices, then renders one still per shot and a contact sheet.
on:
  workflow_dispatch:
    inputs:
      formats:
        description: "short or long (empty = tomorrow's schedule)"
        required: false
        default: "short"
      sample:
        description: "Use the built-in sample story"
        type: boolean
        default: false
      clip:
        description: "Also render a 3 second clip around the first dialogue (checks lip-sync)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y espeak-ng ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-x11-0 \
            libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2
          pip install -r requirements.txt
      - name: Write story, voices, music
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python plan.py --formats "${{ inputs.formats }}" ${{ inputs.sample && '--sample' || '' }}
      - name: Install renderer
        working-directory: engine
        run: npm ci
      - name: Render one still per shot
        working-directory: engine
        run: |
          V=$(ls ../work | head -1)
          cp ../work/$V/{story,timing,flags}.json src/
          mkdir -p out
          python3 - <<'PY' > frames.txt
          import json
          t = json.load(open('src/timing.json'))
          shots = t['shots']
          step = max(1, len(shots) // 12)
          for s in shots[::step][:12]:
              print(s['key'], int((s['start'] + (s['end'] - s['start']) * 0.6) * 30))
          PY
          while read key frame; do
            npx remotion still src/index.jsx Story out/$key.png --frame=$frame --gl=swangle
          done < frames.txt
          ffmpeg -y -loglevel error -pattern_type glob -i 'out/s*.png' -vf "scale=360:-1,tile=6x2" out/_sheet.png
      - name: Optional clip around the first dialogue
        if: ${{ inputs.clip }}
        working-directory: engine
        run: |
          read A B < <(python3 -c "
          import json
          t = json.load(open('src/timing.json'))
          s = next((x for x in t['shots'] if x['speaker'] != 'narrator'), t['shots'][0])
          a = max(0, int((s['start'] - 0.5) * 30)); print(a, a + 90)")
          npx remotion render src/index.jsx Story out/clip.mp4 --frames=$A-$B --gl=swangle --concurrency=1 --muted
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            engine/out/*.png
            engine/out/clip.mp4
            work/*/script.md
          retention-days: 5
